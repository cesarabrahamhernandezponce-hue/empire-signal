<body>
  <span class="mark" id="mark">Empire</span>
  <script>
    const q = new URLSearchParams(location.search);
    const w = parseInt(q.get('w') || '800', 10);
    const h = parseInt(q.get('h') || '300', 10);
    const GRAD = 'linear-gradient(135deg, #3A3D8F 0%, #5B5FCF 100%)';
    const bgParam = q.get('bg') || 'transparent';
    const bg = bgParam === 'cream' ? '#FAFAF8'
             : bgParam === 'gradient' ? GRAD
             : 'transparent';
    const mark = q.get('mark') === 'E' ? 'E' : 'Empire';

    const root = document.body.style;
    root.setProperty('--w', w + 'px');
    root.setProperty('--h', h + 'px');
    root.setProperty('--bg', bg);

    const el = document.getElementById('mark');
    el.textContent = mark;

    // Solid cream foreground (knockout) — reads better than thin gradient
    // strokes when the mark sits on a filled tile, e.g. a tiny favicon.
    if (q.get('fg') === 'cream') {
      el.style.backgroundImage = 'none';
      el.style.webkitTextFillColor = '#FAFAF8';
      el.style.color = '#FAFAF8';
    }

    // Fit the mark to the canvas: shrink font-size until it fits within
    // a comfortable padded box, so nothing looks cramped or clipped.
    function fit() {
      const padOverride = parseFloat(q.get('pad'));
      const padX = !isNaN(padOverride) ? padOverride
                 : mark === 'E' ? 0.30 : 0.14;    // fraction of width as side padding
      const padY = mark === 'E' ? padX : 0.16;    // keep the E vertically tight too
      const maxW = w * (1 - padX * 2);
      const maxH = h * (1 - padY * 2);
      let fs = 10;
      el.style.setProperty('--fs', fs + 'px');
      // grow until either dimension is exceeded
      while (fs < 2000) {
        el.style.setProperty('--fs', (fs + 4) + 'px');
        const r = el.getBoundingClientRect();
        if (r.width > maxW || r.height > maxH) break;
        fs += 4;
      }
      el.style.setProperty('--fs', fs + 'px');
    }

    document.fonts.ready.then(() => {
      fit();
      document.documentElement.setAttribute('data-ready', '1');
    });
  </script>
</body>
</html>
